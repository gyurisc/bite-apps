# Runs the checks AGENTS.md asks for on every pull request and on main, and
# builds the TextBite app and runs its UI tests. macOS runners, because the CLI's save tests use
# macOS access control lists and extended attributes. The Rust version comes
# from rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; every commit on
# main gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    name: TextBite app and its tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # Builds the app, linking the Rust bridge, and its UI tests. Signed ad
      # hoc, so no developer account is needed. The same build as
      # `scripts/check.sh --app`, kept as its own step so a build failure is
      # told apart from a UI test failure.
      - name: Build app and its tests
        run: >
          xcodebuild build-for-testing
          -project apps/TextBite/TextBite.xcodeproj
          -scheme TextBite
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
      # UI tests drive the app through macOS Automation Mode, which otherwise
      # asks for a password.
      - run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Run unit and UI tests
        run: >
          xcodebuild test-without-building
          -project apps/TextBite/TextBite.xcodeproj
          -scheme TextBite
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build
